version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: koda_postgres
    restart: always
    environment:
      POSTGRES_USER: koda_user
      POSTGRES_PASSWORD: koda_password
      POSTGRES_DB: koda_db
    ports:
      - "5434:5432" 
    volumes:
      - koda_db_data:/var/lib/postgresql/data
volumes:
  koda_db_data: